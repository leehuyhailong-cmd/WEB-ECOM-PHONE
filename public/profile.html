<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý Tài khoản - Phonestore</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
      background: var(--bg-card-solid);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
    }
    .profile-header {
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .profile-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <!-- Header (minimal) -->
  <header style="background: var(--bg-card-solid); border-bottom: 1px solid var(--border-subtle); padding: 1rem 0;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="/" class="logo" style="text-decoration:none;">📱 Phonestore</a>
      <div style="display:flex; gap:1rem;">
        <a href="/orders.html" style="color:var(--text-main);text-decoration:none;">📦 Đơn hàng của tôi</a>
        <a href="/" style="color:var(--text-main);text-decoration:none;">🏪 Về cửa hàng</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="profile-container">
      <div class="profile-header">
        <h2 style="font-family: var(--font-heading);">Quản lý Tài khoản</h2>
        <p style="color: var(--text-subtle);">Cập nhật thông tin cá nhân của bạn</p>
      </div>
      
      <form id="profileForm">
        <div class="form-group">
          <label>Họ và Tên</label>
          <input type="text" id="profileName" class="search-input" style="border-radius:var(--radius-sm);" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="profileEmail" class="search-input" style="border-radius:var(--radius-sm);" disabled>
          <small style="color:var(--text-subtle);display:block;margin-top:0.25rem;">Email không thể thay đổi</small>
        </div>
        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="text" id="profilePhone" class="search-input" style="border-radius:var(--radius-sm);">
        </div>
        
        <div class="profile-actions">
          <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
          <button type="button" class="btn btn-secondary" onclick="window.appStore.logout()">Đăng xuất</button>
        </div>
      </form>
    </div>
  </main>
  
  <div id="toastContainer" class="toast-container"></div>
  
  <script type="module">
    import { API } from './js/api.js';
    import { AppStore } from './js/app.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
      window.appStore = new AppStore();
      
      if (!window.appStore.state.currentUser) {
        window.location.href = '/login.html';
        return;
      }
      
      const user = window.appStore.state.currentUser;
      document.getElementById('profileName').value = user.name || '';
      document.getElementById('profileEmail').value = user.email || '';
      document.getElementById('profilePhone').value = user.phone || '';
      
      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        window.appStore.showToast('Tính năng đang được cập nhật', 'info');
      });
    });
  </script>
</body>
</html>
